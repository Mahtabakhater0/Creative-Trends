<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<script>
  (function() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var iosUrl = "https://apps.apple.com/in/app/mlibrary-your-mobile-elibrary/id1454498417";
    var androidUrl = "https://play.google.com/store/search?q=mlibrary&c=apps";

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(iosUrl);
    } else if (/android/i.test(ua)) {
      window.location.replace(androidUrl);
    } else {
      // Desktop / unknown device -> default to Play Store
      window.location.replace(androidUrl);
    }
  })();
</script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px;">Redirecting to app store...</p>
</body>
</html>
